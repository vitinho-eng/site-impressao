<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Pokédex | Terminal de Impressão 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0a0a0c;
    --panel-bg: rgba(16, 20, 25, 0.85);
    --text-main: #e0e6ed;
    --text-muted: #6b7c93;
    --neon-blue: #00f0ff;
    --neon-red: #ff003c;
    --neon-green: #25D366; 
    
    /* Tipos */
    --t-fogo: #ff5252;
    --t-agua: #448aff;
    --t-planta: #69f0ae;
    --t-eletrico: #ffd740;
    --t-psiquico: #e040fb;
    --t-fantasma: #7c4dff;
    --t-normal: #b0bec5;
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    overflow-x: hidden;
    background-image: 
      linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
    background-size: 30px 30px;
  }

  body::after {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px);
    pointer-events: none;
    z-index: 9999;
  }

  h1, h2, h3, .font-tech {
    font-family: 'Orbitron', sans-serif;
  }

  /* ════════════════════════════════
     HEADER
  ════════════════════════════════ */
  header {
    border-bottom: 1px solid rgba(0, 240, 255, 0.2);
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
  }

  .logo {
    font-size: 20px;
    font-weight: 900;
    color: var(--neon-blue);
    text-transform: uppercase;
    letter-spacing: 3px;
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .status-blinker {
    width: 10px; height: 10px;
    background: var(--neon-red);
    border-radius: 50%;
    animation: blink 1.5s infinite;
    box-shadow: 0 0 10px var(--neon-red);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 25px;
  }

  .btn-voltar {
    color: var(--neon-blue);
    text-decoration: none;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    border: 1px solid rgba(0, 240, 255, 0.4);
    padding: 6px 15px;
    border-radius: 4px;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: rgba(0, 240, 255, 0.05);
  }

  .btn-voltar:hover {
    background: rgba(0, 240, 255, 0.2);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    border-color: var(--neon-blue);
  }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* ════════════════════════════════
     GRID DE ESPÉCIMES
  ════════════════════════════════ */
  .container {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 30px;
  }

  .card {
    background: var(--panel-bg);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 20px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    backdrop-filter: blur(5px);
  }

  .card::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
    background: var(--type-color, var(--neon-blue));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s cubic-bezier(0.86, 0, 0.07, 1);
  }

  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px rgba(var(--type-rgb), 0.3);
    border-color: rgba(255, 255, 255, 0.2);
  }

  .card:hover::before { transform: scaleX(1); }

  .card-img-wrapper {
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 15px;
  }

  .card img {
    max-height: 100%;
    filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
    transition: transform 0.3s;
  }

  .card:hover img { transform: scale(1.1); }

  .card-id { font-size: 12px; color: var(--text-muted); letter-spacing: 2px; }
  .card-name { font-size: 22px; margin: 5px 0 10px; color: #fff; text-transform: uppercase;}
  
  .type-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    background: var(--type-color);
    color: #000;
    box-shadow: 0 0 8px var(--type-color);
  }

  /* ════════════════════════════════
     MODAL / SCANNER INTERFACE
  ════════════════════════════════ */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(10px);
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .modal-overlay.active { opacity: 1; pointer-events: auto; }

  .modal-content {
    background: var(--panel-bg);
    border: 1px solid var(--type-color, var(--neon-blue));
    box-shadow: 0 0 40px rgba(var(--type-rgb), 0.15), inset 0 0 20px rgba(var(--type-rgb), 0.1);
    width: 90%; 
    max-width: 900px;
    max-height: 95vh; /* Limita a altura para dispositivos móveis */
    overflow-y: auto; /* Permite rolar se o conteúdo for maior que a tela */
    border-radius: 8px;
    position: relative;
    display: flex; flex-direction: column;
    transform: scale(0.95);
    transition: transform 0.3s ease;
  }

  /* Custom Scrollbar para o modal */
  .modal-content::-webkit-scrollbar { width: 6px; }
  .modal-content::-webkit-scrollbar-thumb { background: var(--type-color); border-radius: 4px; }

  .modal-overlay.active .modal-content { transform: scale(1); }

  /* BOTÃO DE FECHAR (X) FUNCIONAL E DESTACADO */
  .btn-close {
    position: absolute; 
    top: 15px; 
    right: 15px;
    background: rgba(0,0,0,0.6); 
    border: 1px solid rgba(255,255,255,0.2); 
    color: #fff;
    width: 35px;
    height: 35px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px; 
    cursor: pointer; 
    transition: all 0.2s;
    font-family: 'Orbitron', sans-serif;
    z-index: 100; /* Garante que ficará acima de tudo e será clicável */
  }
  .btn-close:hover { 
    color: var(--neon-red); 
    border-color: var(--neon-red);
    background: rgba(255, 0, 60, 0.1);
  }

  /* Loader do Scanner */
  .scanner-loader {
    position: absolute; inset: 0;
    background: var(--bg-dark);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 90;
    transition: opacity 0.5s;
  }
  
  .scanner-line {
    width: 200px; height: 2px;
    background: var(--neon-blue);
    box-shadow: 0 0 10px var(--neon-blue);
    position: relative;
    overflow: hidden;
  }
  .scanner-line::after {
    content: ''; position: absolute; top:0; left:0; width: 50px; height: 100%;
    background: #fff; animation: scanAnim 1s linear infinite;
  }
  @keyframes scanAnim { 0% { transform: translateX(-50px); } 100% { transform: translateX(200px); } }
  
  .loader-text { margin-top: 15px; font-family: 'Orbitron', sans-serif; letter-spacing: 3px; color: var(--neon-blue); animation: blink 1s infinite; }

  /* Grid do Modal Interno */
  .modal-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    padding: 40px;
    opacity: 0;
  }

  .data-ready .modal-body {
    animation: fadeInData 0.8s forwards;
  }

  @keyframes fadeInData { to { opacity: 1; } }

  /* CAIXA DA IMAGEM E AJUSTE PERFEITO */
  .specimen-img-container {
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    padding: 15px;
    position: relative;
    width: 100%;
    height: 280px; /* Altura fixa do quadro */
  }
  
  .specimen-img-container img {
    width: 100%;
    height: 100%;
    object-fit: contain; /* Essa propriedade faz a imagem se adequar exatamente ao quadro */
    filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8));
  }

  /* Info Física & Lore */
  .physical-data {
    display: flex; gap: 30px; margin: 20px 0;
    font-size: 18px; color: var(--neon-blue);
  }

  /* Botão do WhatsApp (Comércio) */
  .btn-pedir {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    background: rgba(37, 211, 102, 0.1);
    border: 1px solid var(--neon-green);
    color: var(--neon-green);
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    border-radius: 4px;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: inset 0 0 10px rgba(37, 211, 102, 0.1);
  }

  .btn-pedir:hover {
    background: rgba(37, 211, 102, 0.2);
    box-shadow: 0 0 20px rgba(37, 211, 102, 0.4), inset 0 0 15px rgba(37, 211, 102, 0.3);
    transform: translateY(-2px);
  }

  /* Stats e Barras de Progresso */
  .stats-panel h3 { color: var(--text-muted); margin-bottom: 15px; font-size: 16px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;}
  
  .stat-row { display: flex; align-items: center; margin-bottom: 12px; font-size: 14px; }
  .stat-label { width: 45px; font-weight: bold; color: #fff; }
  .stat-bar-bg {
    flex-grow: 1; height: 6px; background: rgba(255,255,255,0.1);
    border-radius: 3px; margin: 0 15px; overflow: hidden;
  }
  .stat-bar-fill {
    height: 100%; background: var(--type-color);
    width: 0;
    box-shadow: 0 0 8px var(--type-color);
    transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .stat-val { width: 30px; text-align: right; font-family: 'Orbitron', sans-serif; }

  .lore-box {
    background: rgba(0,0,0,0.3); padding: 15px;
    border-left: 3px solid var(--type-color);
    font-size: 15px; line-height: 1.5; color: #ccc;
    font-style: italic;
  }

  .combat-tactics { margin-top: 25px; }
  .tactic-row { margin-bottom: 10px; display: flex; align-items: center; gap: 10px;}
  .tactic-label { width: 80px; font-size: 12px; color: var(--text-muted); text-transform: uppercase; }
  .tags-container { display: flex; gap: 5px; flex-wrap: wrap; }
  
  .mini-tag {
    font-size: 10px; padding: 3px 8px; border-radius: 3px;
    text-transform: uppercase; border: 1px solid currentColor;
    background: rgba(0,0,0,0.5);
  }

  /* MEDIA QUERIES (Celular e Telas Menores) */
  @media(max-width: 768px){
    header { flex-direction: column; gap: 15px; text-align: center; }
    .header-right { flex-direction: column; gap: 10px; }
    
    .modal-body { 
      grid-template-columns: 1fr; 
      gap: 20px; 
      padding: 20px; 
      padding-top: 40px; /* Dá espaço para o botão X */
    }
    
    .specimen-img-container { height: 220px; } /* Menor no celular, mas mantém proporção */
    
    .physical-data { justify-content: space-between; gap: 10px; }
    
    .btn-close { top: 10px; right: 10px; width: 30px; height: 30px; font-size: 18px; }
  }
</style>
</head>

];

const grid = document.getElementById('pokedex-grid');
const modal = document.getElementById('scan-modal');
const modalContent = document.getElementById('modal-content');
const loader = document.getElementById('scanner-loader');
const btnClose = document.getElementById('btn-close');

// Renderiza os Cards
db.forEach((poke, index) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--type-color', poke.color);
  card.style.setProperty('--type-rgb', poke.rgb);
  card.style.animationDelay = `${index * 0.1}s`;
  
  card.innerHTML = `
    <div class="card-img-wrapper"><img src="${poke.imgCard}" alt="${poke.name}"></div>
    <div class="card-id">#${poke.id}</div>
    <h3 class="card-name font-tech">${poke.name}</h3>
    <span class="type-badge">${poke.typeLabel}</span>
  `;
  
  card.addEventListener('click', () => openModal(poke));
  grid.appendChild(card);
});

// Lógica do Modal
function openModal(poke) {
  modalContent.style.setProperty('--type-color', poke.color);
  modalContent.style.setProperty('--type-rgb', poke.rgb);

  document.getElementById('m-id').textContent = `ESPÉCIME #${poke.id}`;
  document.getElementById('m-name').textContent = poke.name;
  
  // Tratamento da Imagem: Tenta carregar a foto do Produto. 
  // Se der erro (arquivo local não existir), puxa a arte oficial 2D para não ficar em branco.
  const imgEl = document.getElementById('m-img');
  imgEl.src = poke.imgPrint; 
  imgEl.onerror = () => { imgEl.src = poke.imgCard; };
  
  document.getElementById('m-height').textContent = poke.height;
  document.getElementById('m-price').textContent = poke.price;
  document.getElementById('m-type').textContent = poke.typeLabel;
  document.getElementById('m-lore').textContent = poke.lore;

  const mensagem = `Olá! Autenticação do sistema Terminal_Dex aprovada. Gostaria de encomendar a impressão 3D do espécime #${poke.id} - ${poke.name}.`;
  document.getElementById('btn-whatsapp').href = `https://wa.me/5511999999999?text=${encodeURIComponent(mensagem)}`;

  const cWeak = document.getElementById('m-weak');
  const cResist = document.getElementById('m-resist');
  cWeak.innerHTML = poke.weaknesses.map(w => `<span class="mini-tag" style="color:#ff5252; border-color:#ff5252">${w}</span>`).join('');
  cResist.innerHTML = poke.resistances.map(r => `<span class="mini-tag" style="color:#448aff; border-color:#448aff">${r}</span>`).join('');

  const statsHtml = Object.entries(poke.stats).map(([key, val]) => {
    const percent = Math.min((val / 150) * 100, 100);
    return `
      <div class="stat-row">
        <div class="stat-label">${key.toUpperCase()}</div>
        <div class="stat-bar-bg"><div class="stat-bar-fill" data-width="${percent}%"></div></div>
        <div class="stat-val">${val}</div>
      </div>
    `;
  }).join('');
  document.getElementById('stats-container').innerHTML = statsHtml;

  modal.classList.add('active');
  modalContent.classList.remove('data-ready');
  loader.style.opacity = '1';
  loader.style.display = 'flex';

  setTimeout(() => {
    loader.style.opacity = '0';
    setTimeout(() => {
      loader.style.display = 'none';
      modalContent.classList.add('data-ready');
      
      setTimeout(() => {
        document.querySelectorAll('.stat-bar-fill').forEach(bar => {
          bar.style.width = bar.getAttribute('data-width');
        });
      }, 100);

    }, 300);
  }, 1200); 
}

function closeModal() {
  modal.classList.remove('active');
}

btnClose.addEventListener('click', closeModal);
modal.addEventListener('click', (e) => {
  if (e.target === modal) closeModal();
});
</script>
